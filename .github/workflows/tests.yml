name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out layout.nvim
        uses: actions/checkout@v5

      - name: Set up Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Check out mini.nvim
        uses: actions/checkout@v5
        with:
          repository: echasnovski/mini.nvim
          path: .deps/mini.nvim

      - name: Run tests
        env:
          MINI_NVIM_PATH: ${{ github.workspace }}/.deps/mini.nvim
        run: scripts/run_tests.sh
